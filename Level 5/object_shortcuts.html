<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object_shortcuts</title>
</head>
<body>
    <script>
        let product = { 
            company: 'Mango',
            price: 861,
            'item-name': 'Cotton Stripped T-shirt',
        };

        // OBJECT DESTRUCTURING [shorthand notation for accessing properties from the object] // 
        let {company, price} = product;
        console.log(company);
        console.log(price);





        // Proprety Shorthand //
        let cost = 862;
        let material = {
            company: 'Mango',
            itemName: 'Cotton Stripped T-shirt',
            cost: cost,
        };

        // this is same as //
        let material_1 = {
            company: 'Mango',
            itemName: 'Cotton sstripped T-shirt',
            cost,
        };




        // Method shorthand 
        let material_2 = {
            company: 'Mango',
            itemName: 'Cotton Stripped T-shirt',
            displayCompany: function(){
                return `${this.company}`;
            },
        };

        // this is same as // 
        let material_3 = {
            company: 'Infosys',
            itemName: 'e-commerce app',
            displayCompany(){
                return `${this.company}`;
            },
        };
    </script>
</body>
</html>
