<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>break continue</title>
</head>
<body>
    <script>

        // BREAK CONDITION //

        // in case of normal number count //
        for(let i = 0; i < 50; i++){
            console.log(i);
            if(i == 34){
                break;
            }
        }


        // in case of array //
        let arr = [1,2,3,4,5,6,7,8,9,0];
        for (let i = 0; i < arr.length; i++) {
            if(arr[i] == 6){
                console.log(`number found at index ${i}`);
                break;
            }
            console.log(`still looking`);
        }


        // CONTINUE CONDITION //

        // it skips the current iteration inside a loop //

        // for printing even numbers //
        for(let i = 0; i <= 25; i++){
            if(i % 2 != 0){
                continue;
            }
            console.log(`${i} `);
        }

        // for skipping a value in an array // 
        for (let i = 0; i < arr.length; i++) {
            if(arr[i] == 7){
                continue;
            }
            console.log(`${i} `);
        }





    </script>
</body>
</html>
