<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop</title>
</head>
<body>
    <script>

        // while loop //
        let num = 1; // initialization //
        while(num <= 10){
            console.log(num);
            num++;
        }

        // why while is loop is an non-standard loop (used in non-standared condition) //
        let v = 0;
        while(v < 1){
            console.log(v);
            v = Math.random() * 2;
        }
        console.log('final value of v is : ' + v);
        
    </script>
</body>
</html>
